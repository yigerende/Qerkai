# pnpm 11 不再读 package.json 的 pnpm.overrides；这里复刻同一组安全版本锁定，
# 使 --frozen-lockfile 安装能与已提交的 pnpm-lock.yaml 对齐。
overrides:
  js-cookie: 3.0.7
  form-data@<4.0.6: '>=4.0.6'
  postcss@<8.5.18: '>=8.5.18'
  dompurify@<3.4.14: '>=3.4.14'

# esbuild / vue-demi 需要 postinstall 才能正常工作
allowBuilds:
  esbuild: true
  vue-demi: true
